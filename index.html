<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hello World from binghuan's games on GitHub Pages.">
    <title>Hello World | Games</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101828; color: #f9fafb; padding: 24px; }
      main { text-align: center; max-width: 640px; }
      .label { color: #a5b4fc; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 20px 0; font-size: clamp(48px, 10vw, 88px); letter-spacing: -.05em; line-height: 1.1; }
      p { color: #cbd5e1; font-size: 18px; line-height: 1.6; }
      a { display: inline-block; margin-top: 20px; padding: 12px 20px; border-radius: 10px; background: #a5b4fc; color: #101828; font-weight: 600; text-decoration: none; }
      a:hover { background: #c7d2fe; }
      a:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Games · GitHub Pages</p>
      <h1>Hello World!</h1>
      <p>A small beginning. Let the games begin.</p>
      <a href="https://github.com/binghuan/games">View on GitHub</a>
    </main>
  </body>
</html>
